name: CodeQL

# Static analysis for the React/TypeScript application. Catches classes of
# problem that ESLint does not, such as unsafe DOM handling and injection
# patterns in data flow.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # 09:00 each Monday, so advisories added after a merge still surface.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@v4
